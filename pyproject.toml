[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gouyan-runboard"
version = "0.3.0"
description = "构研 RunBoard — 本地优先的中文深度学习实验监控器"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.urls]
Homepage = "https://github.com/CloudWhiteTower/gouyan-runboard"
Source = "https://github.com/CloudWhiteTower/gouyan-runboard"
Issues = "https://github.com/CloudWhiteTower/gouyan-runboard/issues"

[project.optional-dependencies]
server = [
  "mlflow-skinny>=3.6,<4", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "optuna>=4.2,<5", "tensorboard>=2.18,<3", "psutil>=6,<8", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "python-multipart>=0.0.20",
]
lightning = ["lightning>=2.4,<3"]
system = ["psutil>=6,<8"]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2", "ruff>=0.14,<1"]

[project.scripts]
runboard = "runboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runboard = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
